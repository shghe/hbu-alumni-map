<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>公众号主页封面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 900px; height: 383px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .cover { width: 900px; height: 383px; display: flex; align-items: center; background: #0b5d4a; padding: 0 46px 0 50px; }
    .text { flex: 1; min-width: 0; padding-right: 26px; display: flex; flex-direction: column; justify-content: center; }
    .brand { color: #cfe9df; font-size: 15px; letter-spacing: 4px; }
    h1 { color: #ffffff; font-size: 38px; font-weight: 800; line-height: 1.3; margin: 12px 0 10px; letter-spacing: 0; }
    .subtitle { color: #ffd98a; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .entry { color: #d8ebe4; font-size: 14px; line-height: 1.8; margin-top: 18px; }
    .entry strong { color: #ffffff; font-weight: 700; }
    .line { width: 56px; height: 4px; background: #ffd98a; border-radius: 2px; margin-top: 16px; }
    .phone-wrap { flex: 0 0 210px; text-align: center; }
    .phone { width: 150px; height: 330px; border-radius: 20px; overflow: hidden; border: 4px solid #ffffff; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28); margin: 0 auto; }
    .phone img { width: 100%; height: 100%; display: block; }
    .badge { display: inline-block; margin-top: 8px; background: rgba(255, 255, 255, 0.14); color: #ffffff; font-size: 12px; padding: 3px 10px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="text">
      <div class="brand">河北大学校友地图</div>
      <h1>校友之家，<br />越聚越多</h1>
      <div class="subtitle">HBU校友之家地图正式上线</div>
      <div class="entry">15 家校友之家已上线，<br />打开 <strong>hbu港城之家</strong> → 点击 <strong>校友地图</strong></div>
      <div class="line"></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><img src="../assets/screenshots/map-page-real.jpg" alt="校友地图主页面" /></div>
      <div class="badge">校友地图主页面</div>
    </div>
  </div>
</body>
</html>

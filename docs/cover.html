<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>公众号封面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 900px; height: 383px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0b5d4a; }
    .cover { position: relative; width: 900px; height: 383px; background: #0b5d4a; display: flex; align-items: center; padding: 0 46px 0 50px; }
    .text { flex: 1; min-width: 0; padding-right: 30px; }
    .eyebrow { color: #cfe9df; font-size: 15px; letter-spacing: 3px; }
    h1 { color: #ffffff; font-size: 40px; font-weight: 800; line-height: 1.3; margin: 12px 0 14px; letter-spacing: 0; }
    .sub { color: #d8ebe4; font-size: 16px; line-height: 1.7; }
    .sub strong { color: #ffd98a; font-weight: 700; }
    .phone-wrap { flex: 0 0 178px; text-align: center; }
    .phone { width: 148px; height: 310px; border-radius: 20px; overflow: hidden; border: 4px solid #ffffff; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28); }
    .phone img { width: 148px; height: 310px; object-fit: cover; display: block; }
    .badge { display: inline-block; margin-top: 10px; background: rgba(255, 255, 255, 0.14); color: #ffffff; font-size: 12px; padding: 3px 10px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="text">
      <div class="eyebrow">河北大学校友地图</div>
      <h1>河大校友，<br />走到哪都有自己人</h1>
      <div class="sub">15 家校友之家已上线，<br />打开 <strong>hbu港城之家</strong> → 点击 <strong>校友地图</strong></div>
    </div>
    <div class="phone-wrap">
      <div class="phone"><img src="../assets/screenshots/main-page.png" alt="校友地图主页面" /></div>
      <div class="badge">校友之家 · 越聚越多</div>
    </div>
  </div>
</body>
</html>
